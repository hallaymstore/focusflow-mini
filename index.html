body.in-game .side-label{font-size:9px}
.player-form{grid-template-columns:1fr}
.rank-table th,.rank-table td{padding:10px 5px;font-size:11px}
.rank-table td.score{font-size:15px}
.rank-table td.rank{font-size:14px}
}
@media(max-height:590px){

}

</style></head><body><div class="app">
<header><div class="brand"><div class="brand-mark">✦</div><div><div class="brand-name">BAYROQ <span>QUEST</span></div><div class="brand-sub">UZBEKISTAN • GAME QUIZ</div></div></div><div class="header-right"><div class="pill">🇺🇿 <span>18-NOYABR • BAYROQ KUNI</span></div><button class="iconbtn active" id="soundBtn" title="Ovozni yoqish/o‘chirish" aria-label="Ovoz">♫</button></div></header>
<main id="screen"></main><div class="bottom-credit">MADE WITH 🇺🇿 • BAYROQ QUEST 2026 • <a href="https://lex.uz/docs/-100122" target="_blank" rel="noopener noreferrer">RASMIY QONUN</a></div>
</div>
<script>
'use strict';
const $=s=>document.querySelector(s);
const state={phase:'home',time:20,shuffle:true,sound:true,session:null,questions:[],answered:false,saving:false,seconds:20,timer:null,lastFeedback:null,leaderboard:[],error:'',dbReady:false,playerName:'',group:''};
const flagSvg='<svg viewBox="0 0 750 400" class="flag-svg" role="img" aria-label="O‘zbekiston Davlat bayrog‘i"><rect class="top" width="750" height="130"/><rect class="red" y="130" width="750" height="8"/><rect class="mid" y="138" width="750" height="124"/><rect class="red" y="262" width="750" height="8"/><rect class="bottom" y="270" width="750" height="130"/><circle cx="125" cy="60" r="47" fill="white"/><circle cx="144" cy="54" r="43" fill="#13b6e4"/><g fill="white" font-size="26" font-family="Arial"><text x="213" y="29">★ ★ ★</text><text x="194" y="69">★ ★ ★ ★</text><text x="174" y="109">★ ★ ★ ★ ★</text></g></svg>';
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]))}
function play(kind){if(!state.sound)return;try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const ctx=play.ctx||(play.ctx=new C());if(ctx.state==='suspended')ctx.resume();const notes=kind==='ok'?[523,659,784]:kind==='fail'?[360,280]:kind==='win'?[523,659,784,1047]:[660];notes.forEach((note,i)=>{const osc=ctx.createOscillator(),g=ctx.createGain(),at=ctx.currentTime+i*.09;osc.type=kind==='fail'?'sawtooth':'sine';osc.frequency.setValueAtTime(note,at);g.gain.setValueAtTime(.0001,at);g.gain.exponentialRampToValueAtTime(.1,at+.018);g.gain.exponentialRampToValueAtTime(.0001,at+.17);osc.connect(g);g.connect(ctx.destination);osc.start(at);osc.stop(at+.2)})}catch(e){}}
async function api(route,options){const r=await fetch(route,{cache:'no-store',...options,headers:{'Content-Type':'application/json',...(options?.headers||{})}});const data=await r.json().catch(()=>({}));if(!r.ok)throw new Error(data.error||data.message||'Server bilan aloqa uzildi');return data}
function setPhase(p){clearInterval(state.timer);state.phase=p;document.body.classList.toggle('in-game',p==='game');render();window.scrollTo(0,0)}
function render(){if(state.phase==='home')renderHome();else if(state.phase==='game')renderGame();else if(state.phase==='leaderboard')renderLeaderboard();else renderResult();$('#soundBtn').classList.toggle('active',state.sound);$('#soundBtn').textContent=state.sound?'♫':'♪'}
function message(str){state.error=str||'';const e=$('#errorBox');if(e){e.textContent=state.error;e.classList.toggle('hidden',!str)}}
function renderHome(){
$('#screen').innerHTML='<section class="glass hero"><div><div class="eyebrow">✦ O‘ZBEKISTON BAYROG‘I • 25 SAVOL</div><h1>BILIMINGNI<br><em>SINAB KO‘R!</em></h1><p>Ism-familiyangiz va guruhingizni kiriting. Har bir talaba alohida test ishlaydi, natijalaringiz umumiy reytingga qo‘shiladi. 🇺🇿</p>'+
'<div class="player-form"><label>ISM VA FAMILIYA<input maxlength="80" id="fullName" autocomplete="name" placeholder="Masalan: Ali Valiyev" value="'+esc(state.playerName)+'"></label><label>GURUH<input maxlength="40" id="group" autocomplete="organization" placeholder="Masalan: MMT-520-25" value="'+esc(state.group)+'"></label></div>'+
'<div class="setup"><div class="mini-label">SAVOL VAQTI:</div><div class="chip-group">'+[15,20,30].map(n=>'<button class="chip '+(n===state.time?'selected':'')+'" data-time="'+n+'">'+n+'s</button>').join('')+'</div><label class="toggle"><input id="shuffle" type="checkbox" '+(state.shuffle?'checked':'')+'> Aralashtirish</label></div>'+
'<div id="errorBox" class="error-panel '+(state.error?'':'hidden')+'">'+esc(state.error)+'</div><div class="result-actions" style="justify-content:flex-start"><button class="btn primary big" id="start">▶ TESTNI BOSHLASH</button><button class="btn secondary" id="ranking">🏆 REYTING</button></div><div class="intro-note">🔒 Parol talab qilinmaydi • Natijalar serverda hisoblanadi</div></div><div class="hero-flag-wrap">'+flagSvg+'<div class="hero-float">🏅 BAYROQ BILIMDONLARI</div></div></section>';
document.querySelectorAll('[data-time]').forEach(b=>b.onclick=()=>{state.playerName=$('#fullName').value;state.group=$('#group').value;state.time=Number(b.dataset.time);renderHome()});
$('#shuffle').onchange=e=>state.shuffle=e.target.checked;
$('#start').onclick=startGame;$('#ranking').onclick=()=>loadLeaderboard();
$('#fullName').oninput=e=>{state.playerName=e.target.value;message('')};
$('#group').oninput=e=>{state.group=e.target.value;message('')};
}
async function loadQuestions(){if(state.questions.length)return;const d=await api('/api/questions');state.questions=d.questions}
async function startGame(){
if(state.saving)return;
state.playerName=$('#fullName').value.trim().replace(/\s+/g,' ');state.group=$('#group').value.trim().replace(/\s+/g,' ');
if(!/\S+\s+\S+/.test(state.playerName)){message('Ism va familiyani to‘liq kiriting.');return}
if(state.group.length<2){message('Guruh nomini kiriting.');return}
state.saving=true;$('#start').disabled=true;$('#start').textContent='⏳ KIRILMOQDA...';
try{
await loadQuestions();
const d=await api('/api/start',{method:'POST',body:JSON.stringify({fullName:state.playerName,group:state.group,timeLimit:state.time,shuffle:state.shuffle})});
state.session=d.session;
try{localStorage.setItem('bayroq-quest-session',d.session.sessionId)}catch(e){}
state.error='';play('tap');setPhase('game');
}catch(e){message(e.message);$('#start').disabled=false;$('#start').textContent='▶ TESTNI BOSHLASH'}finally{state.saving=false}
}
function curQuestion(){return state.questions[state.session.order[state.session.index]]}
function renderGame(){
state.answered=false;state.saving=false;state.lastFeedback=null;
const s=state.session,n=s.index+1,q=curQuestion();
if(!q){state.error='Savollarni yuklashda xatolik';setPhase('home');return}
$('#screen').innerHTML='<section class="game-layout"><div class="glass game-main"><div class="game-top"><div class="game-progress-label">SAVOL <strong>'+String(n).padStart(2,'0')+'</strong> / '+state.questions.length+'</div><div class="pill">🇺🇿 '+esc(s.fullName)+'</div></div><div class="bar"><div style="width:'+((n-1)/state.questions.length*100)+'%"></div></div><div class="question-zone"><div class="question-tag">✦ SAVOL #'+n+'</div><h1 class="question-text">'+esc(q.text)+'</h1></div><div class="answers">'+(s.choices||q.choices).map((ans,i)=>'<button class="answer '+['red','blue','yellow','green'][i]+'" data-answer="'+i+'"><span class="a-ico">'+['▲','◆','●','■'][i]+'</span><span>'+esc(ans)+'</span><span class="status" id="mark'+i+'"></span></button>').join('')+'</div><div class="feedback hidden" id="feedback"></div></div><aside class="glass game-side"><div class="side-section"><div class="side-label">⏳ VAQT</div><div class="timer-display" id="timerCircle"><div class="timer-inside"><div class="timer-num" id="timerNum">20</div><div class="timer-unit">SONIYA</div></div></div></div><div class="side-section"><div class="side-label">⭐ BALL</div><div class="side-score" id="scoreNum">'+s.score.toLocaleString('en-US')+'</div><div class="stats-row"><span>✅ To‘g‘ri</span><b>'+s.correct+'</b></div><div class="stats-row"><span>🔥 Seriya</span><b>'+s.streak+'</b></div></div><div class="side-section"><div class="side-label">💎 GAME MODE</div><div class="side-mini">'+(s.streak>=5?'👑':s.streak>=3?'🏆':'🚀')+'</div><div class="tiny-help">Tezroq javob bering va ko‘proq XP oling!</div></div></aside></section>';
document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>answer(Number(b.dataset.answer)));
clearInterval(state.timer);
state.timer=setInterval(updateTimer,220);
updateTimer();
}
function updateTimer(){
if(state.phase!=='game'||state.answered)return;
const s=state.session;
const elapsed=(Date.now()-new Date(s.questionAt).getTime())/1000;
const remaining=Math.max(0,Math.ceil(s.timeLimit-elapsed));
state.seconds=remaining;
const timer=$('#timerNum'),circle=$('#timerCircle');
if(timer)timer.textContent=remaining;
if(circle){circle.style.setProperty('--progress',(100*remaining/s.timeLimit)+'%');circle.classList.toggle('urgent',remaining<=5)}
if(remaining===0&&!state.saving)answer(-1);
}
async function answer(selected){
if(state.answered||state.saving||state.phase!=='game')return;
state.saving=true;clearInterval(state.timer);
const buttons=[...document.querySelectorAll('[data-answer]')];buttons.forEach(b=>b.disabled=true);
try{
const s=state.session;const oldChoices=s.choices||curQuestion().choices;const d=await api('/api/answer',{method:'POST',body:JSON.stringify({sessionId:s.sessionId,index:s.index,selected})});
state.session=d.session;state.answered=true;
buttons.forEach((b,i)=>{if(i===d.correctIndex){b.classList.add('correct');$('#mark'+i).textContent='✓'}else if(i===d.selected){b.classList.add('wrong');$('#mark'+i).textContent='✕'}else b.classList.add('dim')});
const f=$('#feedback');f.className='feedback '+(d.ok?'success':'fail');
f.innerHTML='<div><strong>'+(d.ok?'✅ AJOYIB! +'+d.points+' XP':'💡 '+(d.selected===-1?'VAQT TUGADI!':'TO‘G‘RI JAVOB: '+esc(oldChoices[d.correctIndex])))+'</strong><p>'+esc(d.explanation)+'</p></div><button class="btn primary" id="next">'+(d.finished?'🏆 REYTING':'KEYINGI →')+'</button>';
$('#next').onclick=()=>{if(d.finished){try{localStorage.removeItem('bayroq-quest-session')}catch(e){}play('win');setPhase('result');confetti()}else{play('tap');setPhase('game')}};
$('#scoreNum').textContent=state.session.score.toLocaleString('en-US');
play(d.ok?'ok':'fail');
}catch(e){
const f=$('#feedback');f.className='feedback fail';f.innerHTML='<div><strong>⚠️ SERVER XATOSI</strong><p>'+esc(e.message)+'</p></div><button class="btn secondary" id="recover">QAYTA ULASH</button>';
$('#recover').onclick=restoreSession;state.answered=true;
}finally{state.saving=false}
}
function renderResult(){
const s=state.session,pct=Math.round(s.correct/state.questions.length*100);
const grade=pct>=90?'AFSONAVIY NATIJA!':pct>=75?'BARAKALLA!':pct>=50?'YAXSHI HARAKAT!':'YANA URINIB KO‘R!';
$('#screen').innerHTML='<section class="glass result"><div class="eyebrow">✦ MISSION COMPLETE ✦</div><div class="result-crown">'+(pct>=90?'👑':pct>=75?'🏆':pct>=50?'🥈':'🌟')+'</div><h2>'+grade+'</h2><p>'+esc(s.fullName)+' • '+esc(s.group)+'</p><div class="result-score">'+s.score.toLocaleString('en-US')+' <span style="font-size:20px;color:#a2dacc">XP</span></div><div class="result-metrics"><div class="metric"><b style="color:#58f1bf">'+s.correct+'</b><span>✅ TO‘G‘RI</span></div><div class="metric"><b style="color:#ff8d9b">'+s.wrong+'</b><span>❌ XATO</span></div><div class="metric"><b style="color:#ffe194">'+pct+'%</b><span>🎯 ANIQLIK</span></div></div><p>🔥 Eng yaxshi seriya: '+s.maxStreak+' ta</p><div class="result-actions"><button class="btn primary big" id="seeRanks">🏆 REYTINGNI KO‘RISH</button><button class="btn secondary" id="again">↻ QAYTA O‘YNASH</button></div></section>';
$('#seeRanks').onclick=loadLeaderboard;$('#again').onclick=()=>setPhase('home')
}
async function loadLeaderboard(){
clearInterval(state.timer);state.phase='leaderboard';document.body.classList.remove('in-game');
$('#screen').innerHTML='<section class="glass leaderboard"><div class="lb-title"><h1>🏆 UMUMIY REYTING</h1><button id="goBack" class="btn secondary">← ORQAGA</button></div><p>Talabalarning eng yaxshi natijalari. Har bir ism va guruh bo‘yicha eng yuqori ball ko‘rsatiladi.</p><div class="rank-empty">⏳ Natijalar olinmoqda...</div></section>';
$('#goBack').onclick=()=>setPhase(state.session?.status==='finished'?'result':'home');
try{
const d=await api('/api/leaderboard');state.leaderboard=d.items;renderLeaderboard();
}catch(e){$('#screen').querySelector('.rank-empty').textContent='⚠️ '+e.message}
}
function renderLeaderboard(){
$('#screen').innerHTML='<section class="glass leaderboard"><div class="lb-title"><div><div class="eyebrow">✦ BAYROQ QUEST • TOP 100</div><h1>🏆 UMUMIY REYTING</h1></div><button id="goBack" class="btn secondary">← ORQAGA</button></div><p>Natijalar MongoDB Atlas orqali saqlanadi va barcha qurilmalarda bir xil ko‘rinadi. Bir talabaning eng yaxshi natijasi hisobga olinadi.</p>'+
(state.leaderboard.length?'<div style="overflow-x:auto"><table class="rank-table"><thead><tr><th>O‘RIN</th><th>ISM FAMILIYA</th><th>GURUH</th><th>BALL</th><th>ANIQLIK</th></tr></thead><tbody>'+state.leaderboard.map((r,i)=>'<tr><td class="rank">'+(i===0?'🥇':i===1?'🥈':i===2?'🥉':'#'+r.rank)+'</td><td>'+esc(r.fullName)+'</td><td>'+esc(r.group)+'</td><td class="score">'+Number(r.score).toLocaleString('en-US')+'</td><td>'+r.correct+'/25</td></tr>').join('')+'</tbody></table></div>':'<div class="rank-empty">🚀 Hali hech kim testni yakunlamagan. Birinchi bo‘ling!</div>')+
'<div class="lb-tools"><button class="btn primary" id="refreshRanks">↻ YANGILASH</button><button class="btn secondary" id="newGame">▶ TEST ISHLASH</button></div></section>';
$('#goBack').onclick=()=>setPhase(state.session?.status==='finished'?'result':'home');
$('#refreshRanks').onclick=loadLeaderboard;$('#newGame').onclick=()=>setPhase('home')
}
function confetti(){for(let i=0;i<55;i++){const p=document.createElement('div');p.className='confetti';p.style.left=Math.random()*100+'vw';p.style.top='-20px';p.style.background=['#38efbf','#ffdb7a','#ff668a','#4fa9ff','#fff'][i%5];p.style.animationDelay=Math.random()*.8+'s';document.body.appendChild(p);setTimeout(()=>p.remove(),4200)}}
async function restoreSession(){
let id;try{id=localStorage.getItem('bayroq-quest-session')}catch(e){}
if(!id){setPhase('home');return}
try{
await loadQuestions();
const d=await api('/api/session?id='+encodeURIComponent(id));
state.session=d.session;state.playerName=d.session.fullName;state.group=d.session.group;
if(d.session.status==='active')setPhase('game');
else{try{localStorage.removeItem('bayroq-quest-session')}catch(e){}setPhase('result')}
}catch(e){state.error=e.message;setPhase('home')}
}
$('#soundBtn').onclick=()=>{state.sound=!state.sound;$('#soundBtn').classList.toggle('active',state.sound);$('#soundBtn').textContent=state.sound?'♫':'♪';if(state.sound)play('tap')};
document.addEventListener('keydown',e=>{if(state.phase==='game'&&!state.answered&&!state.saving&&['1','2','3','4'].includes(e.key))answer(Number(e.key)-1);else if(state.phase==='game'&&state.answered&&e.key==='Enter')$('#next')?.click()});
if(location.hash==='#reyting')loadLeaderboard();else restoreSession();
</script></body></html>
