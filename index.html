function shuffleList(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function setPhase(p){clearInterval(state.timer);state.phase=p;render();window.scrollTo({top:0,behavior:'smooth'})}
function render(){if(state.phase==='home')renderHome();else if(state.phase==='game')renderGame();else renderResult();$('#soundBtn').classList.toggle('active',state.sound);$('#soundBtn').textContent=state.sound?'♫':'♪'}
function renderHome(){$('#screen').innerHTML='<section class="glass hero"><div><div class="eyebrow">✦ O‘ZBEKISTON BAYROG‘I • 25 SAVOL</div><h1>BILIMINGNI<br><em>SINAB KO‘R!</em></h1><p>Vatanimiz bayrog‘i haqida bilimlaringni sinovdan o‘tkaz! Tez javob ber, yulduzlar to‘pla va eng yuqori natijaga erish. 🇺🇿</p><div class="medals"><span>🏆 25 TA SAVOL</span><span>⚡ TEZLIK BONUSI</span><span>💎 PREMIUM QUIZ</span></div><div class="setup"><div class="mini-label">SAVOL VAQTI:</div><div class="chip-group">'+[15,20,30].map(n=>'<button class="chip '+(n===state.time?'selected':'')+'" data-time="'+n+'">'+n+'s</button>').join('')+'</div></div><div class="setup"><label class="toggle"><input id="shuffle" type="checkbox" '+(state.shuffle?'checked':'')+'> Savollar tartibini aralashtirish</label></div><button class="btn primary big" id="start">▶ &nbsp; O‘YINNI BOSHLASH</button><div class="intro-note">🔒 Ro‘yxatdan o‘tish shart emas • 100% bepul • Mobilga mos</div></div><div class="hero-flag-wrap">'+flagSvg+'<div class="hero-float">🏅 BEST SCORE: '+best().toLocaleString('en-US')+'</div></div></section>';
document.querySelectorAll('[data-time]').forEach(b=>b.onclick=()=>{state.time=Number(b.dataset.time);renderHome()});$('#shuffle').onchange=e=>{state.shuffle=e.target.checked};$('#start').onclick=startGame}
function startGame(){const list=QUESTIONS.map((q,id)=>({q,id}));state.order=state.shuffle?shuffleList(list):list;state.index=0;state.score=0;state.correct=0;state.wrong=0;state.streak=0;state.maxStreak=0;state.results=[];play('tap');setPhase('game')}
function renderGame(){state.answered=false;state.selected=-1;state.seconds=state.time;const n=state.index+1,q=state.order[state.index].q;
$('#screen').innerHTML='<section class="game-layout"><div class="glass game-main"><div class="game-top"><div class="game-progress-label">SAVOL <strong>'+String(n).padStart(2,'0')+'</strong> / '+QUESTIONS.length+'</div><div class="pill">🇺🇿 BAYROQ BILIMDONI</div></div><div class="bar"><div style="width:'+((n-1)/QUESTIONS.length*100)+'%"></div></div><div class="question-zone"><div class="question-tag">✦ SAVOL #'+n+'</div><h1 class="question-text">'+esc(q[0])+'</h1></div><div class="answers">'+q[1].map((answer,i)=>'<button class="answer '+['red','blue','yellow','green'][i]+'" data-answer="'+i+'"><span class="a-ico">'+['▲','◆','●','■'][i]+'</span><span>'+esc(answer)+'</span><span class="status" id="mark'+i+'"></span></button>').join('')+'</div><div class="feedback hidden" id="feedback"></div></div><aside class="glass game-side"><div class="side-section"><div class="side-label">⏳ VAQT</div><div class="timer-display" id="timerCircle"><div class="timer-inside"><div class="timer-num" id="timerNum">'+state.seconds+'</div><div class="timer-unit">SONIYA</div></div></div></div><div class="side-section"><div class="side-label">⭐ TO‘PLANGAN BALL</div><div class="side-score" id="scoreNum">'+state.score.toLocaleString('en-US')+'</div><div class="stats-row"><span>✅ To‘g‘ri</span><b>'+state.correct+'</b></div><div class="stats-row"><span>🔥 Ketma-ket</span><b>'+state.streak+'</b></div></div><div class="side-section"><div class="side-label">💎 BILIM DARAJASI</div><div class="side-mini">'+(state.streak>=5?'👑':state.streak>=3?'🏆':'🚀')+'</div><div class="tiny-help">Tez javob = ko‘proq ball! Klaviaturada 1, 2, 3, 4 tugmalarini ham bosish mumkin.</div></div></aside></section>';
document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>answer(Number(b.dataset.answer)));state.timer=setInterval(()=>{if(state.answered)return;state.seconds--;if(state.seconds<=5&&state.seconds>0)play('tap');if(state.seconds<=0){state.seconds=0;updateTimer();answer(-1);return;}updateTimer();},1000);updateTimer()}
function updateTimer(){const t=$('#timerNum'),c=$('#timerCircle');if(!t||!c)return;t.textContent=state.seconds;c.style.setProperty('--progress',(100*state.seconds/state.time)+'%');c.classList.toggle('urgent',state.seconds<=5)}
function answer(selected){if(state.answered)return;state.answered=true;clearInterval(state.timer);const q=state.order[state.index].q;const ok=selected===q[2];state.selected=selected;if(ok){state.correct++;state.streak++;state.maxStreak=Math.max(state.maxStreak,state.streak);let gained=500+Math.round(state.seconds/state.time*500)+Math.min(state.streak-1,5)*100;state.score+=gained;play('ok')}else{state.wrong++;state.streak=0;play('fail')}
state.results.push({id:state.order[state.index].id,selected,ok,correct:q[2]});
document.querySelectorAll('[data-answer]').forEach((b,i)=>{b.disabled=true;if(i===q[2]){b.classList.add('correct');$('#mark'+i).textContent='✓'}else if(i===selected){b.classList.add('wrong');$('#mark'+i).textContent='✕'}else{b.classList.add('dim')}});
let f=$('#feedback');f.className='feedback '+(ok?'success':'fail');f.innerHTML='<div><strong>'+(ok?'✅ AJOYIB! +'+(500+Math.round(state.seconds/state.time*500)+Math.min(state.streak-1,5)*100)+' BALL':'💡 '+(selected===-1?'VAQT TUGADI!':'TO‘G‘RI JAVOB: '+esc(q[1][q[2]])))+'</strong><p>'+esc(q[3])+'</p></div><button class="btn primary" id="next">'+(state.index===QUESTIONS.length-1?'🏆 NATIJA':'KEYINGI →')+'</button>';
$('#next').onclick=()=>{state.index++;if(state.index>=QUESTIONS.length){saveBest(state.score);play('win');setPhase('result');confetti()}else{play('tap');setPhase('game')}};$('#scoreNum').textContent=state.score.toLocaleString('en-US');
}
function renderResult(){let pct=Math.round(state.correct/QUESTIONS.length*100);let grade=pct>=90?'AFSONAVIY NATIJA!':pct>=75?'BARAKALLA!':pct>=50?'YAXSHI HARAKAT!':'YANA URINIB KO‘R!';let emblem=pct>=90?'👑':pct>=75?'🏆':pct>=50?'🥈':'🌟';let errors=state.results.filter(x=>!x.ok);
$('#screen').innerHTML='<section class="glass result"><div class="eyebrow">✦ MISSION COMPLETE ✦</div><div class="result-crown">'+emblem+'</div><h2>'+grade+'</h2><p>O‘zbekiston Davlat bayrog‘i haqidagi bilimingiz sinovdan o‘tdi!</p><div class="result-score">'+state.score.toLocaleString('en-US')+' <span style="font-size:20px;color:#a2dacc">XP</span></div><div class="result-metrics"><div class="metric"><b style="color:#58f1bf">'+state.correct+'</b><span>✅ TO‘G‘RI</span></div><div class="metric"><b style="color:#ff8d9b">'+state.wrong+'</b><span>❌ XATO</span></div><div class="metric"><b style="color:#ffe194">'+pct+'%</b><span>🎯 ANIQLIK</span></div></div><p>🔥 Eng yaxshi seriya: '+state.maxStreak+' &nbsp; • &nbsp; 🏅 Rekord: '+best().toLocaleString('en-US')+' XP</p><div class="result-actions"><button class="btn primary big" id="again">↻ QAYTA O‘YNASH</button><button class="btn secondary" id="home">⌂ BOSH SAHIFA</button><button class="btn secondary" id="share">↗ NATIJANI ULASHISH</button></div>'+(errors.length?'<div class="review"><h3>📚 Xatolar ustida ishlash ('+errors.length+')</h3>'+errors.map(x=>{let q=QUESTIONS[x.id];return '<div class="review-item"><b>❌ '+(x.id+1)+'. '+esc(q[0])+'</b><small>✅ To‘g‘ri javob: '+esc(q[1][x.correct])+'<br>💬 '+esc(q[3])+'</small></div>'}).join('')+'</div>':'<p>💯 Barcha savollarga to‘g‘ri javob berdingiz!</p>')+'</section>';
$('#again').onclick=startGame;$('#home').onclick=()=>setPhase('home');$('#share').onclick=async()=>{const txt='🇺🇿 BAYROQ QUEST: '+state.correct+'/25 to‘g‘ri • '+state.score+' XP!';if(navigator.share){try{await navigator.share({title:'Bayroq Quest',text:txt,url:location.href});return}catch(e){}}try{await navigator.clipboard.writeText(txt+' '+location.href);$('#share').textContent='✅ NUSXALANDI'}catch(e){$('#share').textContent=txt}}}
function confetti(){for(let i=0;i<85;i++){const p=document.createElement('div');p.className='confetti';p.style.left=(Math.random()*100)+'vw';p.style.top='-20px';p.style.background=['#38efbf','#ffdb7a','#ff668a','#4fa9ff','#fff'][i%5];p.style.animationDelay=(Math.random()*.9)+'s';p.style.animationDuration=(2+Math.random()*2)+'s';document.body.appendChild(p);setTimeout(()=>p.remove(),4800)}}
$('#soundBtn').onclick=()=>{state.sound=!state.sound;renderSoundBtn();if(state.sound)play('tap')};
function renderSoundBtn(){$('#soundBtn').classList.toggle('active',state.sound);$('#soundBtn').textContent=state.sound?'♫':'♪';$('#soundBtn').title=state.sound?'Ovozni o‘chirish':'Ovozni yoqish'}
document.addEventListener('keydown',e=>{if(state.phase==='game'&&!state.answered&&['1','2','3','4'].includes(e.key))answer(Number(e.key)-1);else if(state.phase==='game'&&state.answered&&e.key==='Enter')$('#next')?.click()});
render();
</script></body></html>
